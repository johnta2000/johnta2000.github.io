name: Personal site health

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-site-health
  cancel-in-progress: false

jobs:
  availability:
    name: Live pages and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl deployed pages and their scripts/styles
        run: python scripts/monitoring/site-health.py
