name: Personal site health

on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - 'assets/js/analytics.js'
      - 'tests/analytics.test.cjs'
      - 'scripts/monitoring/site-health.py'
      - 'scripts/monitoring/site-health.test.py'
      - 'scripts/monitoring/site-pages.json'
      - '.github/workflows/site-health.yml'

permissions:
  contents: read

concurrency:
  group: personal-site-health
  cancel-in-progress: false

jobs:
  analytics-checks:
    name: Page metadata and analytics privacy
    # Source checks only need to run when code changes or on manual request.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check page identities and analytics privacy
        run: node --test tests/analytics.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test crawler failure reporting
        run: python scripts/monitoring/site-health.test.py
  availability:
    name: Live pages and assets
    # Scheduled runs check the deployed site, after Pages has had time to build.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Crawl deployed pages and their scripts/styles
        run: python scripts/monitoring/site-health.py
