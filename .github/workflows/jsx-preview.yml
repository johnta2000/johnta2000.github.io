name: JSX draft preview build

on:
  push:
    branches: ['draft/jsx-*']
    paths: ['tools/jsx/**', 'assets/js/analytics.js', 'scripts/preview/**', '.github/workflows/jsx-preview.yml']
  pull_request:
    paths: ['tools/jsx/**', 'assets/js/analytics.js', 'scripts/preview/**', '.github/workflows/jsx-preview.yml']

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build isolated JSX preview
        run: node scripts/preview/build-jsx.mjs
      - name: Verify preview safety
        run: node --test scripts/preview/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: jsx-preview-${{ github.sha }}
          path: .preview/jsx/
          retention-days: 14
