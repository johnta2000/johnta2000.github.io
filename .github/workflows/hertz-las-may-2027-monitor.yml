name: Hertz LAS refresh health

on:
  schedule:
    - cron: "27 15 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/hertz-las-may-2027-monitor.yml'
      - 'scripts/monitoring/hertz-*.mjs'
      - 'hertz-las-may-2027/health.mjs'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test browser evidence and freshness handling
        run: node --test scripts/monitoring/hertz-*.test.mjs
      - name: Verify the public monitor is still refreshing
        if: github.event_name != 'push'
        run: node scripts/monitoring/hertz-health.mjs
      # Collection runs through the local regular-browser scheduled task.
      # Failed health checks fail the workflow so stale data is visible.
