name: Chase Sapphire Reserve tables monitor

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoring-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test collector
        run: node --test scripts/monitoring/chase-reserve-tables.test.mjs

      - name: Collect six OpenTable city lists
        id: collect
        continue-on-error: true
        env:
          CONVEX_URL: https://rapid-shark-565.convex.cloud
          MONITORING_INGEST_SECRET: ${{ secrets.MONITORING_INGEST_SECRET }}
        run: node scripts/monitoring/chase-reserve-tables.mjs

      - name: Commit monitor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/monitoring-data/chase-reserve-tables-baseline.json
          git add .github/monitoring-data/chase-reserve-tables-history.json
          git add .github/monitoring-data/change-feed.json
          git add .github/monitoring-data/state.json
          if git diff --cached --quiet; then
            echo "No monitor data changed."
          else
            git commit -m "Record Chase Reserve tables run"
            git push
          fi

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
