name: Check website changes

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Page metadata, analytics privacy, and publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check page identities, analytics privacy, and deployment handling
        run: node --test tests/analytics.test.cjs scripts/publishing/deploy-pages.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test crawler failure reporting
        run: python scripts/monitoring/site-health.test.py
