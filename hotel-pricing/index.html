<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare hotel prices from credit card programs · John Ta</title>
  <meta name="description" content="Get the signup link from John Ta when his credit card hotel pricing tool is ready.">
  <link rel="canonical" href="https://www.john-ta.com/hotel-pricing/">
  <link rel="icon" href="/assets/img/jt-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="./signup.css?v=2">
  <script src="./signup.js?v=3" defer></script>
</head>
<body>
  <main>
    <a class="byline" href="/">John Ta</a>
    <header>
      <h1>Compare hotel prices from credit card programs</h1>
      <p>I’m working on a tool to compare hotel prices from credit card programs. Want to try it? I’ll send you one email with the signup link when it’s ready.</p>
    </header>
    <form method="post" id="signup">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" maxlength="254" required>
      <label class="consent">
        <input type="checkbox" name="consent" value="hotel-pricing-launch-v1" required>
        <span>Yes, email me the link when it’s ready.</span>
      </label>
      <button type="submit" disabled>Let me know</button>
      <div class="trap" aria-hidden="true" inert><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    </form>
    <noscript>Enable JavaScript to join the list.</noscript>
    <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
</body>
</html>
