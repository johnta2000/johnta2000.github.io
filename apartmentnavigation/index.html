<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://rapid-shark-565.convex.site" crossorigin>
    <link rel="stylesheet" href="/apartmentnavigation/sharing.css?v=20261101-2">
    <script defer src="/apartmentnavigation/sharing.js?v=20261101-2"></script>
    <meta name="format-detection" content="telephone=no">
    <title>Apartment Navigation</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #5c6670;
        --line: #d9dee5;
        --paper: #fbfaf7;
        --panel: #ffffff;
        --red: #c83a32;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--paper);
        color: var(--ink);
      }

      .gate {
        width: min(440px, 100%);
        padding: 26px;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .gate h1 {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .gate p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.4;
        font-weight: 650;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 48px;
        padding: 0 13px;
        border: 2px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        font-size: 18px;
      }

      button {
        width: 100%;
        height: 48px;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: white;
        font: inherit;
        font-size: 17px;
        font-weight: 850;
        cursor: pointer;
      }

      .error {
        min-height: 22px;
        margin-top: 12px;
        color: var(--red);
        font-size: 14px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <form class="gate" id="gate" autocomplete="off">
      <h1>Apartment Navigation</h1>
      <p>Enter the password to view the instructions.</p>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" inputmode="text" autofocus required>
      <button type="submit">Unlock</button>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
    </form>

    <script>
      let encryptedPage;


      function decodeBase64(value) {
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return bytes;
      }

      async function deriveKey(password, salt) {
        const encoded = new TextEncoder().encode(password);
        const material = await crypto.subtle.importKey("raw", encoded, "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
          material,
          { name: "AES-GCM", length: 256 },
          true,
          ["decrypt"]
        );
      }

      async function decryptPage(password) {
        if (!encryptedPage) {
          const response = await fetch("/apartmentnavigation/guide.json?v=8ab0c806da2a0ffc");
          if (!response.ok) throw new Error("load");
          encryptedPage = await response.json();
        }
        const salt = decodeBase64(encryptedPage.salt);
        const iv = decodeBase64(encryptedPage.iv);
        const tag = decodeBase64(encryptedPage.tag);
        const ciphertext = decodeBase64(encryptedPage.ciphertext);
        const combined = new Uint8Array(ciphertext.length + tag.length);
        combined.set(ciphertext);
        combined.set(tag, ciphertext.length);
        const key = await deriveKey(password, salt);
        window.ApartmentOwnerKey = key;
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, combined);
        return JSON.parse(new TextDecoder().decode(decrypted));
      }

      document.getElementById("gate").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const button = form.querySelector("button");
        const error = document.getElementById("error");
        button.disabled = true;
        button.textContent = "Unlocking...";
        error.textContent = "";

        try {
          const unlocked = await decryptPage(document.getElementById("password").value);
          const style = document.createElement("style");
          style.textContent = unlocked.style;
          document.head.append(style);
          document.title = "Apartment Navigation";
          document.body.removeAttribute("style");
          document.body.innerHTML = unlocked.main;
          document.getElementById("password")?.remove();
          window.ApartmentSharing.mount();
        } catch (cause) {
          error.textContent = cause.message === "load" ? "The guide couldn’t load. Check your connection and try again." : "That password did not work.";
          button.disabled = false;
          button.textContent = "Unlock";
          document.getElementById("password").select();
        }
      });
    </script>
  </body>
</html>
