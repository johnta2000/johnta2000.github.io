<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lost Lands 2026 Lineup</title>
    <link rel="canonical" href="">
    <style>
      :root {
        --bg: #061313;
        --bg-strong: #04100f;
        --panel: rgba(8, 25, 22, 0.88);
        --panel-solid: #0a1917;
        --panel-soft: rgba(20, 45, 39, 0.72);
        --line: rgba(160, 225, 197, 0.2);
        --line-strong: rgba(246, 137, 59, 0.48);
        --text: #f8fbef;
        --muted: #b5c9bb;
        --fern: #37d38b;
        --teal: #18c9c1;
        --ember: #ff7b39;
        --gold: #f6cf65;
        --violet: #a685ff;
        --danger: #ff5f6d;
        --shadow: 0 20px 50px rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 0%, rgba(40, 210, 172, 0.18), transparent 34%),
          linear-gradient(180deg, #061715 0, #030908 100%);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Arial, Helvetica, sans-serif;
      }

      body::before {
        position: fixed;
        inset: -28px;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(2, 7, 6, 0.28), rgba(2, 8, 7, 0.8) 52%, rgba(2, 8, 7, 0.92)),
          url("./assets/lost-lands-2026-lineup.jpg") center top / min(1180px, 122vw) auto repeat-y;
        content: "";
        filter: saturate(1.12) contrast(1.03);
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(2, 8, 7, 0.12), rgba(2, 8, 7, 0.72) 36%, rgba(2, 8, 7, 0.88)),
          linear-gradient(90deg, rgba(2, 8, 7, 0.78) 0, rgba(2, 8, 7, 0.18) 22%, rgba(2, 8, 7, 0.18) 78%, rgba(2, 8, 7, 0.78) 100%),
          radial-gradient(circle at 50% 12%, rgba(255, 124, 43, 0.18), transparent 30%),
          radial-gradient(circle at 50% 4%, rgba(24, 201, 193, 0.24), transparent 36%);
        content: "";
        pointer-events: none;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-page {
        min-height: 100vh;
        padding: 24px;
      }

      .shell {
        width: min(1320px, 100%);
        margin: 0 auto;
      }

      .app-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(90deg, rgba(8, 25, 22, 0.96), rgba(18, 42, 35, 0.88)),
          var(--panel-solid);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.22);
      }

      .header-copy {
        flex: 1 1 260px;
        min-width: 0;
      }

      .account-button {
        min-height: 38px;
        padding: 0 12px;
        border: 1px solid rgba(55, 211, 139, 0.45);
        border-radius: 8px;
        background: rgba(55, 211, 139, 0.12);
        color: #d9ffe9;
        font-size: 0.8rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .account-button.is-signed-in {
        border-color: rgba(246, 207, 101, 0.42);
        background: rgba(246, 207, 101, 0.1);
        color: #fff7c6;
      }

      .rally-mode .standalone-auth {
        display: none !important;
      }

      .account-dialog {
        width: min(460px, calc(100vw - 28px));
        max-height: calc(100dvh - 28px);
        padding: 0;
        overflow: auto;
        border: 1px solid rgba(160, 225, 197, 0.28);
        border-radius: 12px;
        background: #081815;
        color: var(--text);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.6);
      }

      .account-dialog::backdrop {
        background: rgba(1, 7, 6, 0.76);
        backdrop-filter: blur(5px);
      }

      .account-dialog-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 20px 8px;
      }

      .account-dialog-head h2,
      .account-dialog-head p {
        margin: 0;
      }

      .account-dialog-head p {
        margin-top: 6px;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.45;
      }

      .dialog-close {
        width: 34px;
        min-width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 1.2rem;
      }

      .account-content {
        padding: 8px 20px 20px;
      }

      .signed-in-card {
        display: grid;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: rgba(4, 16, 15, 0.72);
      }

      .signed-in-card strong,
      .signed-in-card span {
        display: block;
      }

      .signed-in-card span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--gold);
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        max-width: 920px;
        font-size: clamp(1.42rem, 3vw, 2.35rem);
        line-height: 1;
        font-weight: 950;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 0;
      }

      .metric {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 6px 10px;
        border: 1px solid rgba(246, 207, 101, 0.34);
        border-radius: 8px;
        background: rgba(4, 16, 15, 0.72);
        color: #fff7c6;
        font-size: 0.84rem;
        font-weight: 850;
        white-space: nowrap;
      }

      .toolbar {
        position: relative;
        z-index: 20;
        display: grid;
        grid-template-columns:
          minmax(240px, 1.6fr)
          minmax(118px, 0.72fr)
          minmax(138px, 0.86fr)
          minmax(118px, 0.72fr)
          minmax(170px, 1fr)
          auto auto;
        gap: 9px;
        align-items: center;
        margin: 0 0 14px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(5, 19, 18, 0.92);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(16px);
      }

      .search-field,
      .filter-trigger {
        width: 100%;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid rgba(160, 225, 197, 0.28);
        border-radius: 8px;
        background: rgba(4, 16, 15, 0.88);
        color: var(--text);
      }

      .search-field::placeholder {
        color: rgba(181, 201, 187, 0.78);
      }

      .search-field:focus,
      .filter-trigger:focus,
      .button:focus,
      .segmented button:focus,
      .favorite-button:focus {
        outline: 3px solid rgba(24, 201, 193, 0.18);
        border-color: var(--teal);
      }

      .filter-popover {
        position: relative;
        min-width: 0;
      }

      .filter-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
      }

      .filter-trigger:hover,
      .filter-trigger[aria-expanded="true"] {
        border-color: rgba(24, 201, 193, 0.72);
        background: rgba(15, 47, 40, 0.94);
      }

      .filter-trigger-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .filter-caret {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .filter-panel {
        position: absolute;
        top: calc(100% + 7px);
        left: 0;
        z-index: 35;
        width: max-content;
        min-width: 100%;
        max-width: min(360px, calc(100vw - 32px));
        padding: 10px;
        border: 1px solid rgba(160, 225, 197, 0.3);
        border-radius: 10px;
        background: #0a1917;
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
      }

      .filter-panel[hidden] {
        display: none;
      }

      .filter-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 2px 9px;
      }

      .filter-panel-head strong {
        font-size: 0.82rem;
      }

      .filter-panel-clear {
        min-height: 28px;
        padding: 0 7px;
        border: 0;
        background: transparent;
        color: var(--teal);
        font-size: 0.72rem;
        font-weight: 850;
      }

      .filter-options {
        display: grid;
        gap: 3px;
        max-height: 260px;
        overflow: auto;
      }

      .filter-search {
        width: 100%;
        min-height: 36px;
        margin-bottom: 8px;
        padding: 0 9px;
        border: 1px solid rgba(160, 225, 197, 0.28);
        border-radius: 7px;
        background: rgba(4, 16, 15, 0.88);
        color: var(--text);
        font-size: 0.8rem;
      }

      .filter-search::placeholder {
        color: rgba(181, 201, 187, 0.72);
      }

      .filter-option {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 34px;
        padding: 7px 9px;
        border-radius: 7px;
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 750;
        white-space: nowrap;
      }

      .filter-option:hover,
      .filter-option:has(input:checked) {
        background: rgba(24, 201, 193, 0.12);
      }

      .filter-option input {
        width: 16px;
        height: 16px;
        min-height: 16px;
        margin: 0;
        accent-color: var(--teal);
      }

      .filter-empty {
        padding: 12px 9px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .time-panel {
        right: 0;
        left: auto;
        width: min(390px, calc(100vw - 32px));
        padding: 16px;
      }

      .time-range-copy {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: end;
        margin: 5px 0 17px;
      }

      .time-range-copy label {
        display: grid;
        gap: 5px;
      }

      .time-range-copy label span {
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 800;
      }

      .time-range-copy input {
        width: 100%;
        min-height: 38px;
        padding: 0 9px;
        border: 1px solid rgba(160, 225, 197, 0.28);
        border-radius: 7px;
        background: rgba(4, 16, 15, 0.88);
        color: var(--text);
        font: inherit;
        font-size: 0.82rem;
        font-weight: 800;
      }

      .time-range-arrow {
        padding-bottom: 9px;
        color: var(--muted);
      }

      .range-control {
        position: relative;
        height: 38px;
        margin: 0 3px 6px;
      }

      .range-track,
      .range-fill {
        position: absolute;
        top: 17px;
        right: 0;
        left: 0;
        height: 5px;
        border-radius: 999px;
      }

      .range-track {
        background: rgba(181, 201, 187, 0.24);
      }

      .range-fill {
        background: linear-gradient(90deg, var(--teal), var(--gold));
      }

      .range-input {
        position: absolute;
        top: 4px;
        left: 0;
        width: 100%;
        min-height: 28px;
        padding: 0;
        border: 0;
        background: transparent;
        pointer-events: none;
        appearance: none;
      }

      .range-input::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
        border: 3px solid #0a1917;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 2px 9px rgba(0, 0, 0, 0.38);
        cursor: pointer;
        pointer-events: auto;
        appearance: none;
      }

      .range-input::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border: 3px solid #0a1917;
        border-radius: 50%;
        background: var(--gold);
        cursor: pointer;
        pointer-events: auto;
      }

      .segmented {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 40px;
        overflow: hidden;
        border: 1px solid rgba(160, 225, 197, 0.28);
        border-radius: 8px;
        background: rgba(4, 16, 15, 0.88);
      }

      .segmented button {
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 0.86rem;
        font-weight: 850;
      }

      .segmented button.is-active {
        background: linear-gradient(90deg, rgba(55, 211, 139, 0.22), rgba(255, 123, 57, 0.2));
        color: var(--text);
      }

      .button {
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid rgba(246, 137, 59, 0.44);
        border-radius: 8px;
        background: rgba(255, 123, 57, 0.13);
        color: #ffe3c9;
        font-size: 0.86rem;
        font-weight: 900;
        white-space: nowrap;
      }

      .button:hover {
        border-color: rgba(246, 207, 101, 0.72);
        background: rgba(246, 137, 59, 0.22);
      }

      .toggle-button[aria-pressed="true"] {
        border-color: rgba(55, 211, 139, 0.72);
        background: rgba(55, 211, 139, 0.18);
        color: #d9ffe9;
      }

      .status-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .schedule-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .favorite-note {
        color: #ffddb1;
      }

      .favorite-status {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .text-button {
        min-height: 28px;
        padding: 0 9px;
        border: 1px solid rgba(160, 225, 197, 0.26);
        border-radius: 6px;
        background: rgba(4, 16, 15, 0.78);
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 850;
      }

      .text-button:hover {
        border-color: rgba(246, 207, 101, 0.58);
        color: var(--text);
      }

      .content-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(180deg, rgba(8, 25, 22, 0.92), rgba(5, 15, 14, 0.95)),
          var(--panel-solid);
        box-shadow: var(--shadow);
      }

      .day-board {
        display: grid;
        grid-auto-columns: minmax(270px, 1fr);
        grid-auto-flow: column;
        gap: 10px;
        padding: 10px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline proximity;
      }

      .day-column {
        min-width: 0;
        overflow: hidden;
        border: 1px solid rgba(160, 225, 197, 0.18);
        border-radius: 8px;
        background: rgba(4, 16, 15, 0.58);
        scroll-snap-align: start;
      }

      .day-column-header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        padding: 13px;
        border-bottom: 1px solid rgba(160, 225, 197, 0.2);
        background: rgba(7, 24, 21, 0.97);
      }

      .day-column-header strong {
        display: block;
        color: var(--gold);
        font-size: 0.92rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .day-column-header small,
      .day-set-count {
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .day-column-body {
        display: grid;
        gap: 9px;
        padding: 9px;
      }

      .stage-group {
        overflow: hidden;
        border: 1px solid rgba(160, 225, 197, 0.14);
        border-left: 3px solid var(--stage-color);
        border-radius: 7px;
        background: rgba(1, 10, 9, 0.4);
      }

      .stage-group-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 8px;
        background: color-mix(in srgb, var(--stage-color) 14%, transparent);
        color: #f7fff9;
        font-size: 0.67rem;
        font-weight: 950;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .stage-group-header span:last-child {
        color: var(--muted);
        font-size: 0.59rem;
        letter-spacing: 0;
      }

      .day-set-list {
        display: grid;
      }

      .day-set-card {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 7px;
        align-items: center;
        padding: 8px;
        border-top: 1px solid rgba(160, 225, 197, 0.11);
      }

      .day-set-card:first-child {
        border-top: 0;
      }

      .day-set-copy {
        min-width: 0;
      }

      .day-set-time {
        display: block;
        color: var(--muted);
        font-size: 0.64rem;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
        white-space: nowrap;
      }

      .day-set-artist {
        display: block;
        margin-top: 2px;
        overflow: hidden;
        color: var(--text);
        font-size: 0.8rem;
        font-weight: 950;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .day-set-interest {
        grid-column: 2;
        min-width: 0;
        overflow: hidden;
      }

      .table-wrap {
        overflow: visible;
      }

      table {
        width: 100%;
        min-width: 0;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        font-size: 0.92rem;
      }

      col.col-favorite {
        width: 56px;
      }

      col.col-artist {
        width: 27%;
      }

      col.col-start,
      col.col-end {
        width: 13%;
      }

      col.col-stage {
        width: 23%;
      }

      col.col-genre {
        width: auto;
      }

      .rally-only {
        display: none;
      }

      .rally-mode col.rally-only {
        display: table-column;
      }

      .rally-mode th.rally-only,
      .rally-mode td.rally-only {
        display: table-cell;
      }

      .rally-mode col.col-artist {
        width: 22%;
      }

      .rally-mode col.col-start,
      .rally-mode col.col-end {
        width: 11%;
      }

      .rally-mode col.col-stage {
        width: 18%;
      }

      .rally-mode col.col-genre {
        width: 12%;
      }

      .interest-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .interest-person {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 7px 3px 3px;
        border: 1px solid rgba(160, 225, 197, 0.17);
        border-radius: 999px;
        background: rgba(160, 225, 197, 0.07);
        color: #dffbf2;
        font-size: 0.65rem;
        font-weight: 850;
        white-space: nowrap;
      }

      .interest-person i {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 50%;
        background: #d7d0ff;
        color: #251e42;
        font-size: 0.52rem;
        font-style: normal;
        font-weight: 950;
      }

      .interest-person i.coral { background: #ffd8ca; color: #5a281d; }
      .interest-person i.sky { background: #dcedff; color: #20384c; }
      .interest-person i.yellow { background: #fff0b7; color: #493d12; }
      .interest-person i.green { background: #dcefd6; color: #24431c; }
      .interest-person i.pink { background: #ffddec; color: #55223a; }
      .interest-person i.blue { background: #dbe8ff; color: #21365d; }
      .interest-person i.orange { background: #ffe0c5; color: #57351e; }

      .interest-empty {
        color: rgba(202, 230, 220, 0.38);
      }

      th,
      td {
        padding: 13px 16px;
        border-right: 1px solid rgba(160, 225, 197, 0.12);
        border-bottom: 1px solid rgba(160, 225, 197, 0.13);
        text-align: left;
        vertical-align: middle;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      th:first-child,
      td:first-child {
        text-align: center;
      }

      thead {
        position: sticky;
        top: 0;
        z-index: 8;
      }

      th {
        background: #0c1d1a;
        box-shadow: 0 1px 0 rgba(160, 225, 197, 0.16);
        color: #ffddb1;
        font-size: 0.76rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        overflow: hidden;
        text-overflow: clip;
        text-transform: uppercase;
        white-space: nowrap;
      }

      tbody tr:hover {
        background: rgba(55, 211, 139, 0.06);
      }

      .artist-cell,
      .stage-cell {
        min-width: 0;
        color: var(--text);
        font-weight: 900;
        text-transform: uppercase;
      }

      .artist-cell {
        text-align: left;
      }

      .stage-cell {
        color: var(--muted);
        font-size: 0.78rem;
        text-align: left;
      }

      .artist-stage {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .time-cell,
      .genre-cell {

      function formatClock(value) {
        const [hoursValue, minutes] = String(value || "").slice(11, 16).split(":");
        const hours = Number(hoursValue);
        if (!Number.isInteger(hours) || !minutes) return "Time TBD";
        return `${hours % 12 || 12}:${minutes} ${hours >= 12 ? "PM" : "AM"}`;
      }

        notes: entry.timeZone,

      }));

      );
      const timeBounds = {
        min: Math.min(...lineup.map((entry) => entry.startMinutes)),
        max: Math.max(...lineup.map((entry) => entry.startMinutes)),
      };

      const currentIdsByLegacyId = new Map();

      const currentFavoriteIds = (id) => [...(currentIdsByLegacyId.get(id) || [id])];

      const els = {

      const validFavoriteIds = new Set(lineup.map((entry) => entry.id));
      const lineupById = new Map(lineup.map((entry) => [entry.id, entry]));
      const mobileViewQuery = window.matchMedia("(max-width: 760px)");
      const rallyManagedFavorites = window.parent !== window && new URLSearchParams(window.location.search).get("rally") === "1";
      document.documentElement.classList.toggle("rally-mode", rallyManagedFavorites);
      let favorites = new Set();

      let timeMin = timeBounds.min;

      function normalizeText(value) {
        return value
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getCanonicalUrl() {
        const cleanPath = window.location.pathname.replace(/\/index\.html$/, "/");
        return `${window.location.origin}${cleanPath}`;
      }

      function setCanonicalUrl() {
        const canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.href = getCanonicalUrl();
      }

      function getHashParams() {
        const hash = window.location.hash.startsWith("#")
          ? window.location.hash.slice(1)
          : window.location.hash;
        return new URLSearchParams(hash);
      }

      function getIncomingParams() {
        const hashParams = getHashParams();
        if ([...hashParams.keys()].length) return hashParams;
        return new URLSearchParams(window.location.search);
      }

      function encodeSharedFavorites() {
        const bytes = new Uint8Array(Math.ceil(lineup.length / 8));
        favorites.forEach((id) => {
          const index = lineupById.get(id)?.posterIndex;
          if (Number.isInteger(index)) bytes[Math.floor(index / 8)] |= 1 << (index % 8);
        });

        const binary = [...bytes].map((byte) => String.fromCharCode(byte)).join("");
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function decodeSharedFavorites(value) {
        if (!value) return [];

        try {
          const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
          const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
          const binary = atob(padded);
          const ids = [];

          [...binary].forEach((character, byteIndex) => {
            const byte = character.charCodeAt(0);
            for (let bit = 0; bit < 8; bit += 1) {
              const index = byteIndex * 8 + bit;
              if ((byte & (1 << bit)) && lineup[index]) ids.push(lineup[index].id);
            }
          });

          return ids;
        } catch (error) {
          return value
            .split(".")
            .map((token) => Number.parseInt(token, 36))
            .filter((index) => Number.isInteger(index) && lineup[index])
            .map((index) => lineup[index].id);
        }
      }

      function decodeLegacyFavorites(value) {
        if (!value) return [];

        return value
          .split(",")
          .flatMap((id) => currentFavoriteIds(id.trim()))
          .filter((id) => validFavoriteIds.has(id));
      }

      function readStateFromUrl() {
        const params = getIncomingParams();
        els.search.value = params.get("q") || "";
        const type = params.get("type") || params.get("billing") || "all";
        favoritesOnly = params.get("fav") === "1" || type === "favorites";
        selectedDays = new Set((params.get("days") || params.get("day") || "").split(",").filter((value) => dayOrder.includes(value)));
        selectedStages = new Set((params.get("stages") || params.get("stage") || "").split(",").filter((value) => stageOrder.includes(value)));
        selectedGenres = new Set((params.get("genres") || params.get("genre") || "").split(",").filter((value) => genreOrder.includes(value)));
        const incomingMin = Number(params.get("start"));
        const incomingMax = Number(params.get("end"));
        timeMin = Number.isFinite(incomingMin) && incomingMin >= timeBounds.min && incomingMin <= timeBounds.max ? incomingMin : timeBounds.min;
        timeMax = Number.isFinite(incomingMax) && incomingMax >= timeBounds.min && incomingMax <= timeBounds.max ? incomingMax : timeBounds.max;
        if (timeMin > timeMax) {
          timeMin = timeBounds.min;
          timeMax = timeBounds.max;
        }
        activeView = ["board", "poster"].includes(params.get("view")) ? "board" : "table";

        const hasSharedFavorites = params.has("f") || params.has("favorites");
        const sharedFavorites = [
          ...decodeSharedFavorites(params.get("f")),
          ...decodeLegacyFavorites(params.get("favorites"))
        ];

        viewingSharedFavorites = hasSharedFavorites;

        if (hasSharedFavorites) {
          favorites = new Set(sharedFavorites);
        }
      }

      function writeStateToUrl() {
        const params = new URLSearchParams();
        if (els.search.value.trim()) params.set("q", els.search.value.trim());
        if (selectedDays.size) params.set("days", [...selectedDays].join(","));
        if (selectedStages.size) params.set("stages", [...selectedStages].join(","));
        if (selectedGenres.size) params.set("genres", [...selectedGenres].join(","));
        if (timeMin !== timeBounds.min || timeMax !== timeBounds.max) {
          params.set("start", String(timeMin));
          params.set("end", String(timeMax));
        }
        if (activeView !== "table") params.set("view", activeView);
        if (favoritesOnly) params.set("fav", "1");
        const next = `${window.location.pathname}${rallyManagedFavorites ? "?rally=1" : ""}${params.toString() ? `#${params}` : ""}`;
        window.history.replaceState({}, "", next);
      }

      function getFilteredLineup() {
        const query = normalizeText(els.search.value.trim());

        const filtered = lineup.filter((entry) => {
          const matchesQuery =
            !query ||
            normalizeText(`${entry.artist} ${entry.day} ${entry.stage} ${entry.billing} ${entry.genre} ${entry.time}`).includes(query);
          const matchesDay = !selectedDays.size || selectedDays.has(entry.day);
          const matchesGenre = !selectedGenres.size || selectedGenres.has(entry.genre);
          const matchesStage = !selectedStages.size || selectedStages.has(entry.stage);
          const matchesTime = entry.startMinutes >= timeMin && entry.startMinutes <= timeMax;
          const matchesFavorite = !favoritesOnly || favorites.has(entry.id);

          return matchesQuery && matchesDay && matchesGenre && matchesStage && matchesTime && matchesFavorite;
        });

        return filtered.sort((left, right) => left.posterIndex - right.posterIndex);
      }

      function renderDayBoard(entries) {

          .filter((day) => entries.some((entry) => entry.day === day))

              return `

            return `

              </section>

          .join("");

      function renderTable(entries) {

        let renderedDay = "";

      function formatFestivalDate(value) {
        const [, month, day] = String(value || "").split("-").map(Number);
        if (!month || !day) return "Date TBD";
        return new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(new Date(2026, month - 1, day));
      }

      function renderInterest(artistId) {
        const people = Array.isArray(lineupInterests[artistId]) ? lineupInterests[artistId] : [];
        if (!people.length) return `<span class="interest-empty">—</span>`;
        return `<div class="interest-list">${people.map((person) => {
          const allowedColors = new Set(["coral", "sky", "purple", "yellow", "green", "pink", "blue", "orange"]);
          const color = allowedColors.has(person.color) ? person.color : "purple";
          return `<span class="interest-person" title="${escapeHtml(person.name)}"><i class="${color}">${escapeHtml(person.initials)}</i><span>${escapeHtml(person.name)}</span></span>`;
        }).join("")}</div>`;
      }

      function updateCurrentMemberInterest(artistId) {
        if (!rallyManagedFavorites || !currentRallyMember) return;
        const people = Array.isArray(lineupInterests[artistId]) ? lineupInterests[artistId] : [];
        const withoutCurrent = people.filter((person) => person.id !== currentRallyMember.id);
        if (favorites.has(artistId)) withoutCurrent.push(currentRallyMember);
        if (withoutCurrent.length) lineupInterests[artistId] = withoutCurrent;
        else delete lineupInterests[artistId];
      }

      function render() {
        const entries = getFilteredLineup();
        const favoriteTotal = favorites.size;
        els.resultCount.textContent = `Showing ${entries.length} of ${lineup.length} sets`;
        els.favoriteCount.textContent =
          favoriteTotal === 1 ? "1 favorite" : `${favoriteTotal} favorites`;
        renderDayBoard(entries);
        renderTable(entries);
        updateFilterControls();
        updateViewButtons();
        writeStateToUrl();
      }

      function saveFavorites() {
        if (rallyManagedFavorites) {
          window.parent.postMessage({ type: "rally-lineup-favorites-changed", artistIds: [...favorites] }, window.location.origin);
          viewingSharedFavorites = false;
          return;
        }
        viewingSharedFavorites = false;
        if (!cloudAccount) return;
        window.clearTimeout(cloudSaveTimer);
        cloudSaveTimer = window.setTimeout(async () => {
          try {
            await convexMutation("lineupFavorites:saveMine", {
              eventId: LINEUP_EVENT_ID,
              artistIds: [...favorites],
            });
            showToast("Favorites synced.");
          } catch (error) {
            showToast(error.message || "Could not sync favorites.");
          }
        }, 250);
      }

      function setView(view) {
        activeView = view;
        render();
      }

      function toggleFavoritesOnly() {
        favoritesOnly = !favoritesOnly;
        render();
      }

      function saveFavoritesAsMine() {
        if (!rallyManagedFavorites && !cloudAccount) {
          openAccountDialog();
          return;
        }
        saveFavorites();
        render();
        showToast(rallyManagedFavorites ? "Saved to your Rally profile." : "Saving to your account…");
      }

      function showToast(message) {
        const existing = document.querySelector(".toast");
        if (existing) existing.remove();

        const toast = document.createElement("div");
        toast.className = "toast";
        toast.setAttribute("role", "status");
        toast.textContent = message;
        document.body.append(toast);
        window.setTimeout(() => toast.remove(), 2200);
      }

      async function initializeOptionalAccount() {
        if (rallyManagedFavorites) return;
        try {
          if (!window.Clerk) throw new Error("Clerk did not load");
          await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
          window.Clerk.addListener(({ user }) => {
            if (user && !cloudAccount) void loadCloudFavorites();
            if (!user && cloudAccount) {
              cloudAccount = null;
              favorites = new Set();
              render();
            }
          });
          if (window.Clerk.isSignedIn) await loadCloudFavorites();
          else updateViewButtons();
        } catch (error) {
          console.warn("Optional lineup sign-in could not initialize", error);
          els.accountButton.hidden = false;
          els.accountButton.textContent = "Sign in unavailable";
          els.accountButton.disabled = true;
        }
      }

      async function loadCloudFavorites() {
        try {
          const result = await convexQuery("lineupFavorites:getMine", { eventId: LINEUP_EVENT_ID });
          cloudAccount = { name: result.name || "Account" };
          if (!viewingSharedFavorites) {
            favorites = new Set((result.artistIds || []).flatMap(currentFavoriteIds).filter((id) => validFavoriteIds.has(id)));
          }
          render();
          if (els.accountDialog.open) renderAccountDialog();
        } catch (error) {
          console.warn("Could not load synced lineup favorites", error);
          showToast("Signed in, but favorites could not load.");
        }
      }

      function openAccountDialog() {
        if (rallyManagedFavorites || els.accountButton.disabled) return;
        els.accountDialog.showModal();
        renderAccountDialog();
      }

      function renderAccountDialog() {
        try { window.Clerk?.unmountSignIn(els.accountContent); } catch (error) { /* Not mounted yet. */ }
        if (cloudAccount) {
          els.accountDialogTitle.textContent = "Favorites are synced";
          els.accountDialogCopy.textContent = "Your Lost Lands picks follow this account on any device.";
          els.accountContent.innerHTML = `
            <div class="signed-in-card">
              <div><strong>${escapeHtml(cloudAccount.name)}</strong><span>${favorites.size} saved favorite${favorites.size === 1 ? "" : "s"}</span></div>
              <button class="button" id="account-sign-out" type="button">Sign out</button>
            </div>
          `;
          document.getElementById("account-sign-out").addEventListener("click", async () => {
            await window.Clerk.signOut();
            cloudAccount = null;
            favorites = new Set();
            els.accountDialog.close();
            render();
          });
          return;
        }

        els.accountDialogTitle.textContent = "Save your lineup";
        els.accountDialogCopy.textContent = "Create an account or sign in to keep favorites synced across devices.";
        els.accountContent.innerHTML = "";
        window.Clerk.mountSignIn(els.accountContent, {
          routing: "virtual",
          withSignUp: true,
          appearance: {
            variables: {
              colorPrimary: "#37d38b",
              colorBackground: "#fffef9",
              borderRadius: "9px",
              fontFamily: "Inter, ui-sans-serif, system-ui",
            },
          },
        });
      }

      async function convexQuery(path, args) {
        return convexCall("query", path, args);
      }

      async function convexMutation(path, args) {
        return convexCall("mutation", path, args);
      }

      async function convexCall(kind, path, args) {
        const token = await getConvexToken();
        if (!token) throw new Error("Sign in to sync your favorites.");
        const response = await fetch(`${CONVEX_URL}/api/${kind}`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ path, args }),
        });
        const result = await response.json();
        if (!response.ok || result.status !== "success") {
          throw new Error(result.errorMessage || `Convex ${kind} failed`);
        }
        return result.value;
      }

      async function getConvexToken() {
        const session = window.Clerk?.session;
        if (!session) return null;
        const sessionToken = await session.getToken();
        const audience = readJwtPayload(sessionToken)?.aud;
        if (audience === "convex" || (Array.isArray(audience) && audience.includes("convex"))) return sessionToken;
        try { return await session.getToken({ template: "convex" }); } catch (error) { return sessionToken; }
      }

      function readJwtPayload(token) {
        if (!token) return null;
        try {
          const encoded = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
          return JSON.parse(decodeURIComponent(escape(atob(encoded))));
        } catch (error) {
          return null;
        }
      }

      async function shareCurrentView() {
        writeStateToUrl();
        const params = getHashParams();
        if (favorites.size) params.set("f", encodeSharedFavorites());
        const url = `${getCanonicalUrl()}${params.toString() ? `#${params}` : ""}`;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(url);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = url;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            document.body.append(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          showToast("Lineup link copied.");
        } catch (error) {
          showToast("Could not copy the link.");
        }
      }

      function filterValues(name) {
        if (name === "days") return dayOrder;
        if (name === "stages") return stageOrder;
        return genreOrder;
      }

      function selectedFilter(name) {
        if (name === "days") return selectedDays;
        if (name === "stages") return selectedStages;
        return selectedGenres;
      }

      function summarizeFilter(name, selected) {
        const singular = name === "days" ? "day" : name === "stages" ? "stage" : "genre";
        if (!selected.size) return `All ${name}`;
        if (selected.size === 1) return [...selected][0];
        return `${selected.size} ${singular}s`;
      }

      function formatFilterTime(value) {
        const normalized = value % (24 * 60);
        const hours = Math.floor(normalized / 60);
        const minutes = normalized % 60;
        return formatClock(`2026-01-01T${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`);
      }

      function parseFilterTime(value) {
        const match = String(value || "").trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
        if (!match) return null;
        let hours = Number(match[1]);
        const minutes = Number(match[2] || 0);
        const meridiem = match[3];
        if (minutes > 59 || hours > 23) return null;
        if (meridiem) {
          if (hours < 1 || hours > 12) return null;
          if (meridiem === "pm" && hours !== 12) hours += 12;
          if (meridiem === "am" && hours === 12) hours = 0;
        }
        return (hours < 12 ? hours + 24 : hours) * 60 + minutes;
      }

      function closeFilterPopovers(except = null) {
        els.filterPopovers.forEach((popover) => {
          if (popover === except) return;
          popover.querySelector(".filter-trigger").setAttribute("aria-expanded", "false");
          popover.querySelector(".filter-panel").hidden = true;
        });
      }

      function updateFilterControls() {
        els.filterPopovers.forEach((popover) => {
          const name = popover.dataset.filter;
          const label = popover.querySelector(".filter-trigger-label");
          if (name === "times") {
            const fullRange = timeMin === timeBounds.min && timeMax === timeBounds.max;
            label.textContent = fullRange ? "Set start times" : `${formatFilterTime(timeMin)} – ${formatFilterTime(timeMax)}`;
            return;
          }
          const selected = selectedFilter(name);
          label.textContent = summarizeFilter(name, selected);
          popover.querySelectorAll("input[type=checkbox]").forEach((input) => {
            input.checked = selected.has(input.value);
          });
        });

        els.timeMin.value = String(timeMin);
        els.timeMax.value = String(timeMax);
        els.timeMinText.value = formatFilterTime(timeMin);
        els.timeMaxText.value = formatFilterTime(timeMax);
        const span = timeBounds.max - timeBounds.min || 1;
        els.timeRangeFill.style.left = `${((timeMin - timeBounds.min) / span) * 100}%`;
        els.timeRangeFill.style.right = `${100 - ((timeMax - timeBounds.min) / span) * 100}%`;
      }

      function setTimeRange(nextMin, nextMax) {
        timeMin = Math.max(timeBounds.min, Math.min(nextMin, nextMax, timeBounds.max));
        timeMax = Math.min(timeBounds.max, Math.max(nextMax, timeMin, timeBounds.min));
        render();
      }

      function applyTypedTime(input, boundary) {
        const parsed = parseFilterTime(input.value);
        if (parsed === null) {
          updateFilterControls();
          return;
        }
        if (boundary === "min") setTimeRange(Math.min(parsed, timeMax), timeMax);
        else setTimeRange(timeMin, Math.max(parsed, timeMin));
      }

      function clearScheduleFilters() {
        els.search.value = "";
        selectedDays = new Set();
        selectedStages = new Set();
        selectedGenres = new Set();
        timeMin = timeBounds.min;
        timeMax = timeBounds.max;
        favoritesOnly = false;
        render();
      }

      function initFilterControls() {
        els.filterPopovers.forEach((popover) => {
          const name = popover.dataset.filter;
          const trigger = popover.querySelector(".filter-trigger");
          const panel = popover.querySelector(".filter-panel");
          const clear = popover.querySelector(".filter-panel-clear");

          trigger.addEventListener("click", () => {
            const opening = panel.hidden;
            closeFilterPopovers(popover);
            panel.hidden = !opening;
            trigger.setAttribute("aria-expanded", String(opening));
          });

          clear?.addEventListener("click", () => {
            const search = popover.querySelector(".filter-search");
            if (search) {
              search.value = "";
              search.dispatchEvent(new Event("input"));
            }
            if (name === "times") setTimeRange(timeBounds.min, timeBounds.max);
            else {
              selectedFilter(name).clear();
              render();
            }
          });

          if (name === "times") return;
          const options = popover.querySelector(".filter-options");
          options.innerHTML = filterValues(name).map((value) => `
            <label class="filter-option"><input type="checkbox" value="${escapeHtml(value)}"><span>${escapeHtml(value)}</span></label>
          `).join("");
          const search = popover.querySelector(".filter-search");
          const empty = document.createElement("div");
          empty.className = "filter-empty";
          empty.textContent = "No matches";
          empty.hidden = true;
          options.after(empty);
          search.addEventListener("input", () => {
            const query = normalizeText(search.value.trim());
            let visible = 0;
            options.querySelectorAll(".filter-option").forEach((option) => {
              option.hidden = Boolean(query) && !normalizeText(option.textContent).includes(query);
              if (!option.hidden) visible += 1;
            });
            empty.hidden = visible > 0;
          });
          options.addEventListener("change", (event) => {
            const input = event.target.closest("input[type=checkbox]");
            if (!input) return;
            const selected = selectedFilter(name);
            if (input.checked) selected.add(input.value);
            else selected.delete(input.value);
            render();
          });
        });

        [els.timeMin, els.timeMax].forEach((input) => {
          input.min = String(timeBounds.min);
          input.max = String(timeBounds.max);
          input.step = "5";
        });
        els.timeMin.addEventListener("input", () => setTimeRange(Math.min(Number(els.timeMin.value), timeMax), timeMax));
        els.timeMax.addEventListener("input", () => setTimeRange(timeMin, Math.max(Number(els.timeMax.value), timeMin)));
        [[els.timeMinText, "min"], [els.timeMaxText, "max"]].forEach(([input, boundary]) => {
          input.addEventListener("blur", () => applyTypedTime(input, boundary));
          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              applyTypedTime(input, boundary);
              input.blur();
            }
          });
        });
      }

      function bindEvents() {
        els.search.addEventListener("input", render);

        els.posterViewButton.addEventListener("click", () => setView("board"));
        els.tableViewButton.addEventListener("click", () => setView("table"));
        els.clearFiltersButton.addEventListener("click", clearScheduleFilters);
        els.favoritesFilterButton.addEventListener("click", toggleFavoritesOnly);
        els.saveFavoritesButton.addEventListener("click", saveFavoritesAsMine);
        els.shareButton.addEventListener("click", shareCurrentView);
        els.accountButton.addEventListener("click", openAccountDialog);
        els.accountDialogClose.addEventListener("click", () => els.accountDialog.close());
        els.accountDialog.addEventListener("click", (event) => {
          if (event.target === els.accountDialog) els.accountDialog.close();
        });
        document.addEventListener("pointerdown", (event) => {
          if (!event.target.closest(".filter-popover")) closeFilterPopovers();
        }, true);
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeFilterPopovers();
        });

        const handleFavoriteClick = (event) => {
          const button = event.target.closest("[data-favorite-id]");
          if (!button) return;

          const id = button.dataset.favoriteId;
          const wasViewingSharedFavorites = viewingSharedFavorites;
          if (favorites.has(id)) {
            favorites.delete(id);
          } else {
            favorites.add(id);
          }

          updateCurrentMemberInterest(id);
          saveFavorites();
          render();
          if (!rallyManagedFavorites && !cloudAccount && !anonymousHintShown) {
            anonymousHintShown = true;
            showToast("Sign in to keep favorites across devices.");
          }
          if (wasViewingSharedFavorites) showToast("Edited list saved as yours.");
        };
        els.tableBody.addEventListener("click", handleFavoriteClick);
        els.posterContent.addEventListener("click", handleFavoriteClick);

        window.addEventListener("popstate", () => {
          readStateFromUrl();
          render();
        });

        if (rallyManagedFavorites) {
          window.addEventListener("message", (event) => {
            if (event.origin !== window.location.origin || event.source !== window.parent || !event.data || typeof event.data !== "object") return;
            if (event.data.type === "rally-lineup-state" && Array.isArray(event.data.artistIds)) {
              favorites = new Set(event.data.artistIds.flatMap(currentFavoriteIds).filter((id) => validFavoriteIds.has(id)));
              lineupInterests = {};
              if (event.data.interests && typeof event.data.interests === "object") {
                Object.entries(event.data.interests).forEach(([artistId, people]) => {
                  if (!Array.isArray(people)) return;
                  currentFavoriteIds(artistId).forEach((currentId) => {
                    if (!validFavoriteIds.has(currentId)) return;
                    const existingPeople = lineupInterests[currentId] || [];
                    lineupInterests[currentId] = [...existingPeople, ...people].filter((person, index, all) =>
                      person?.id && all.findIndex((candidate) => candidate?.id === person.id) === index
                    );
                  });
                });
              }
              currentRallyMember = event.data.currentMember && typeof event.data.currentMember === "object" ? event.data.currentMember : null;
              viewingSharedFavorites = false;
              render();
            }
            if (event.data.type === "rally-lineup-favorites-saved") showToast("Saved to your Rally profile.");
          });
        }

        mobileViewQuery.addEventListener("change", render);
      }

      els.artistCount.textContent = `${lineup.length} sets`;
      els.scheduleRange.textContent = `Starts ${formatFilterTime(timeBounds.min)} – ${formatFilterTime(timeBounds.max)} · EDT`;
      initFilterControls();
      setCanonicalUrl();
      readStateFromUrl();
      bindEvents();
      render();
      if (rallyManagedFavorites) window.parent.postMessage({ type: "rally-lineup-ready" }, window.location.origin);
      else window.addEventListener("load", initializeOptionalAccount, { once: true });
    </script>
  </body>
</html>
