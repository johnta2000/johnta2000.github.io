<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1c1d19" />
    <title>Rally · Rave project rooms</title>
    <link rel="stylesheet" href="./styles.css?v=10" />
    <link rel="stylesheet" href="./meetups.css?v=1" />
    <link rel="stylesheet" href="./boot.css?v=1" />
    <style>
      [hidden]{display:none!important}
      .event-menu{max-height:calc(100dvh - 145px);overflow-y:auto;z-index:40}
      .event-menu .new-event-menu-item{border-top:1px solid #484a42;margin-top:8px;padding-top:15px;color:#dfff52}
      input,textarea,[contenteditable=true]{scroll-margin-block:24px}
      @media(max-width:760px){
        input:not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important}
        .access-gate{height:var(--rally-viewport-height,100dvh);bottom:auto;overflow-y:auto;align-items:start;padding:80px 16px 32px}
        .access-card{width:100%;max-width:420px;margin:auto}
        .access-card h1{font-size:36px;line-height:1.05;letter-spacing:-.05em}
        .access-card>p:not(.eyebrow){margin:14px auto;line-height:1.45}
        .access-gate:has(input:focus) .access-card>h1,.access-gate:has(input:focus) .access-card>.eyebrow,.access-gate:has(input:focus) .access-card>p:not(.auth-status){display:none}
        .dialog-backdrop{align-items:start;overflow-y:auto;max-height:var(--rally-viewport-height,100dvh);padding:16px}
        .dialog{max-height:calc(var(--rally-viewport-height,100dvh) - 32px);overflow-y:auto}
        .page-heading h1{font-size:32px}.page-heading p{font-size:14px;line-height:1.5}
        .field>span{font-size:13px}.primary,.secondary{min-height:44px;font-size:14px}
      }
      .dialog-actions{display:grid;gap:9px}
      .dialog-actions.split{grid-template-columns:1fr 1fr}
      .danger-button{min-height:40px;padding:0 14px;border:1px solid #e3b7b1;border-radius:8px;background:#fff7f5;color:#a13a2e;font-size:.7rem;font-weight:820;cursor:pointer}
      .danger-button.armed{border-color:#9f3126;background:#9f3126;color:#fff}
      .editable-card{position:relative;padding-right:52px}
      .card-menu{position:absolute;top:12px;right:12px;width:32px;height:28px;border:1px solid #d8d9ce;border-radius:7px;background:#fff;color:#73756c;cursor:pointer}
      .member-actions{display:flex;align-items:center;gap:6px}
      .member-action.remove{border-color:#e3c4bf;background:#fff8f6;color:#9d4035}
      .claimed-label{color:#6f7168;font-size:.58rem;font-weight:800}
      .confirm-dialog{width:min(430px,100%)}
      .room-note{margin:8px 0!important;color:#5f6258!important;line-height:1.45}
      .room-price{display:block;margin-top:9px;font-size:.76rem}
      .room-stats{display:flex;gap:8px;margin-top:15px}
      .room-stats span{padding:7px 9px;border-radius:7px;background:#efefe8;color:#696b62;font-size:.61rem;font-weight:760}
      .room-stats strong{color:#292a25;font-size:.72rem}
      .event-menu button small{display:block;line-height:1.35}
      .event-menu .event-menu-date{margin-top:4px;color:#dfff52;font-weight:820}
      .invite-section{display:grid;gap:7px;margin:0 0 14px}
      .invite-section>span{color:#606259;font-size:.63rem;font-weight:820}
      .invite-privacy{margin:2px 0 15px;color:#77796f;font-size:.61rem;line-height:1.45}
      .grouped-flight{display:block!important;padding:20px!important}
      .flight-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-right:34px}
      .flight-head h3{margin:0;font-size:1rem}
      .confirmation-pill{padding:5px 8px;border-radius:6px;background:#efefe8;color:#696b62;font-size:.58rem;font-weight:850}
      .flight-route{display:grid;grid-template-columns:1fr minmax(80px,160px) 1fr;align-items:center;gap:16px;margin:22px 0;padding:18px 0;border-top:1px solid #e5e5dc;border-bottom:1px solid #e5e5dc;text-align:left}
      .flight-route>div:last-child{text-align:right}
      .flight-route strong,.flight-route span{display:block}
      .flight-route strong{font-size:1.75rem;letter-spacing:-.04em}
      .flight-route span{margin-top:4px;color:#75776e;font-size:.7rem}
      .flight-route i{display:flex;align-items:center;gap:8px;color:#696b62;font-style:normal}
      .flight-route i b{display:block;flex:1;height:1px;background:#cacbc1}
      .flight-travelers{display:grid;gap:9px}
      .flight-travelers>small{color:#77796f;font-size:.58rem;font-weight:850;text-transform:uppercase}
      .flight-travelers>div{display:flex;flex-wrap:wrap;gap:6px}
      .traveler-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:999px;background:#f0f0e9;font-size:.62rem;font-weight:780}
      .traveler-chip i,.member-picker i{display:grid;width:24px;height:24px;place-items:center;border-radius:50%;font-size:.5rem;font-style:normal;font-weight:900}
      .member-picker{display:flex;flex-wrap:wrap;gap:7px}
      .member-picker button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border:1px solid #d7d8cd;border-radius:999px;background:#fff;color:#66685f;font-size:.62rem;font-weight:780;cursor:pointer}
      .member-picker button.selected{border-color:#6758cf;background:#efedff;color:#5042a5;box-shadow:inset 0 0 0 1px #6758cf}
      .page.lineup{height:calc(100dvh - 65px - var(--offline-status-height,0px))}
      @media(max-width:900px){.main-column{padding-bottom:0}.page.lineup{height:calc(100dvh - 65px - var(--offline-status-height,0px))}}
      @media(max-width:620px){.toast{bottom:12px}}
      @media(max-width:620px){.dialog-actions.split{grid-template-columns:1fr}.flight-route{grid-template-columns:1fr 60px 1fr}.flight-route strong{font-size:1.4rem}.grouped-flight{padding:16px!important}}
      .project-search{width:min(600px,calc(100% - 24px));max-height:calc(var(--rally-viewport-height,100dvh) - 32px);padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink)}
      .project-search::backdrop{background:#14181188}.project-search header{display:flex;justify-content:space-between;align-items:center;gap:12px}.project-search h2{font-size:20px;margin:0}.project-search header button{border:0;border-radius:10px;width:44px;height:44px;background:#eeefe6;font-size:24px;cursor:pointer}
      .project-search>p{font-size:13px;color:var(--muted);margin:4px 0 16px}.project-search input{width:100%;height:48px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:white;color:var(--ink)}
      .search-results{display:grid;gap:6px;margin-top:12px;max-height:52dvh;overflow:auto}.search-results a{display:block;padding:12px;border-radius:10px;text-decoration:none;color:var(--ink);background:#f4f4ed}.search-results a:hover,.search-results a:focus-visible{background:#e9eddd}.search-results strong,.search-results small{display:block}.search-results strong{font-size:14px;line-height:1.4}.search-results small{font-size:12px;color:#767b6b;margin-top:4px;line-height:1.4}.search-results p{font-size:14px;color:var(--muted)}
      .search-highlight{outline:3px solid #9bb667;outline-offset:4px;scroll-margin:90px}
      @media(max-width:900px){
        :root{--rally-safe-top:env(safe-area-inset-top,0px);--rally-safe-bottom:env(safe-area-inset-bottom,0px);--rally-nav-height:64px;--rally-nav-clearance:calc(var(--rally-nav-height) + var(--rally-safe-bottom) + 28px)}
        html,body{background:var(--paper)}
        .main-column{padding-bottom:0}
        .topbar{height:calc(65px + var(--rally-safe-top));padding-top:var(--rally-safe-top);padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
        .sidebar{padding-top:calc(20px + var(--rally-safe-top));padding-bottom:calc(20px + var(--rally-safe-bottom))}
        .page:not(.lineup){padding-bottom:var(--rally-nav-clearance)}
        .page.lineup{height:calc(100dvh - 65px - var(--rally-safe-top) - var(--offline-status-height,0px))}
        .lineup-frame{display:block}
        .bottom-nav{inset:auto max(12px,env(safe-area-inset-right)) calc(10px + var(--rally-safe-bottom)) max(12px,env(safe-area-inset-left));height:var(--rally-nav-height);padding:0;display:flex;gap:10px;border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
        .nav-glass-group,#quickSearch{background:rgba(255,254,249,.76);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 24px #2028191a,inset 0 1px 1px #fff;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);pointer-events:auto}
        .nav-glass-group{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px;border-radius:40px}
        .bottom-nav a,.bottom-nav button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-width:0;border:0;border-radius:32px;background:transparent;color:#50564c;font:600 10px system-ui;text-decoration:none;cursor:pointer}
        .bottom-nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .bottom-nav a.active,.bottom-nav button[aria-current=page]{color:#293d21;background:rgba(107,127,81,.16)}.bottom-nav button:active{background:#e5eadc}
        .bottom-nav #quickSearch{flex:0 0 var(--rally-nav-height);height:var(--rally-nav-height);border:1px solid rgba(255,255,255,.9);background:rgba(255,254,249,.76)}
        #quickSearch svg{width:27px;height:27px}
        body:has(input:focus) .bottom-nav,body:has(textarea:focus) .bottom-nav,body:has([contenteditable=true]:focus) .bottom-nav,body.lineup-overlay .bottom-nav{visibility:hidden;pointer-events:none}
        .toast{bottom:var(--rally-nav-clearance)}
        .project-search{margin-top:calc(16px + var(--rally-safe-top))}.search-results{max-height:calc(var(--rally-viewport-height,100dvh) - var(--rally-safe-top) - 230px)}
        .dialog-backdrop{padding-top:calc(16px + var(--rally-safe-top));padding-bottom:calc(16px + var(--rally-safe-bottom))}
        .dialog{max-height:calc(var(--rally-viewport-height,100dvh) - var(--rally-safe-top) - var(--rally-safe-bottom) - 32px)}
        .gate-brand{top:calc(26px + var(--rally-safe-top))}
        .access-gate{padding-top:calc(80px + var(--rally-safe-top));padding-bottom:calc(32px + var(--rally-safe-bottom))}
      }
      @media(prefers-reduced-transparency:reduce){
        .nav-glass-group,.bottom-nav #quickSearch{background:#fffef9;backdrop-filter:none;-webkit-backdrop-filter:none}
      }
      .auth-recovery .access-card>h1,.auth-recovery .access-card>p:not(.auth-status){display:none}
      .auth-recovery{overflow-y:auto}
      #authTitle{font-size:1.8rem;letter-spacing:-.04em}
      .auth-recovery .auth-status{font-size:.95rem;overflow-wrap:anywhere}
      #authOptions{display:grid;gap:10px;margin:20px auto;max-width:360px}
      #authOptions[hidden]{display:none}
      #authOptions button{min-height:44px;height:auto;padding:12px;text-align:center;white-space:normal}
      .lineup-day-settings{display:grid;gap:8px;margin:18px 0}
      .lineup-day-settings label{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #dce1d2;border-radius:10px;cursor:pointer;font-size:15px}
      .lineup-day-settings input{width:20px;height:20px;accent-color:#697f45}
      .lineup-day-settings small{margin-left:auto;color:#7a8470;font-size:12px}
      .lineup-day-settings label:has(input:checked){background:#f0f4e7;border-color:#c5d3b0}
    </style>
  </head>
  <body class="booting">
    <section id="accessGate" class="access-gate" hidden>
      <div class="gate-brand"><span class="brand-mark"><i></i><i></i><i></i></span> Rally</div>
      <div class="access-card">
        <p class="eyebrow">Private rave rooms</p>
        <h1>Everyone on the<br><em>same wavelength.</em></h1>
        <p>Rooms, flights, passes, people, and loose ends—together in one place.</p>
        <div id="clerkSignIn"></div>
        <h2 id="authTitle" hidden></h2>
        <p id="authStatus" class="auth-status" role="status">Loading secure sign-in…</p>
        <div id="authOptions" hidden></div>
        <button id="authSignOut" class="text-button" hidden>Use a different email</button>
      </div>
    </section>

    <div id="rallyApp" class="app-shell">
      <aside id="sidebar" class="sidebar">
        <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>Rally</strong><button id="closeMenu" class="mobile-only">×</button></div>
        <button id="eventSwitcher" class="event-switcher"><span id="eventThumb">LL</span><span><small>Project room</small><strong id="eventName">Lost Lands '26</strong></span><b>⌄</b></button>
        <div id="eventMenu" class="event-menu" hidden></div>
        <nav id="sideNav" aria-label="Rally sections"><span class="nav-skeleton"></span><span class="nav-skeleton"></span><span class="nav-skeleton short"></span></nav>
        <div class="sidebar-bottom"><button id="sidebarSearch">Search this rave</button><button id="signOut">Sign out</button><a href="/">← john-ta.com</a></div>
      </aside>
      <button id="menuBackdrop" class="menu-backdrop" hidden aria-label="Close menu"></button>
      <main class="main-column">
        <header class="topbar"><button id="openMenu" class="icon-button">☰</button><div class="mobile-event"><strong id="mobileEventName"></strong><small id="mobileCountdown"></small></div><span></span><button id="topInvite" class="secondary">＋ Invite crew</button><button id="accountButton" class="avatar" aria-label="Your profile">?</button></header>
        <div id="page" class="page"><section class="boot-heading"><i></i><b></b><span></span></section><div class="boot-grid"><article></article><article></article><article></article><article></article><article></article><article></article></div></div>
      </main>
      <nav id="mobileNav" class="bottom-nav" aria-label="Quick navigation"></nav>
    </div>
    <dialog id="projectSearch" class="project-search" aria-labelledby="projectSearchTitle"><header><h2 id="projectSearchTitle">Search this rave</h2><button type="button" aria-label="Close search">×</button></header><p id="searchScope"></p><input id="projectSearchInput" type="search" placeholder="Artists, people, hotels, flights…" aria-label="Search this project" autocomplete="off"><div id="searchResults" class="search-results" aria-live="polite"></div></dialog>
    <div id="dialogRoot"></div>
    <div id="toast" class="toast" hidden></div>

    <script defer src="./keyboard.js?v=1"></script>
    <script defer crossorigin="anonymous" src="https://clerk.john-ta.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
    <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuam9obi10YS5jb20k" src="https://clerk.john-ta.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
    <script defer src="./offline.js?v=1"></script>
    <script defer src="../../lost-lands-2026-lineup/set-times.js"></script>
    <script defer src="./meetups.js?v=1"></script>
    <script defer src="./app.js?v=30"></script>
  </body>
</html>
