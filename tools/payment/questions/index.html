<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f7f8f5">
<title>Payment questions — John Ta</title><link rel="icon" href="../../../assets/img/jt-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../../rally/note-editor.css">
<script async data-clerk-script crossorigin="anonymous" src="https://clerk.john-ta.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
<script async data-clerk-script crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuam9obi10YS5jb20k" src="https://clerk.john-ta.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
<script defer src="../../rally/note-rich-text.js"></script><script defer src="../../rally/note-editor.js"></script><script defer src="app.js"></script>
</head><body><main>
<nav><a href="../../payments/">← Payments</a><button id="sign-out" class="quiet" hidden>Sign out</button></nav>
<header><div><h1>Payment questions<span>.</span></h1><p class="muted">A note, a screenshot, and somewhere to leave it.</p></div><button id="new" class="primary" hidden>+ New note</button></header>
<p id="notice" role="status" hidden></p>
<section id="gate" class="card"><h2>Your private notes</h2><p id="gate-message">Loading sign-in…</p><div id="sign-in"></div><button id="retry-auth" hidden>Try again</button></section>
<section id="app" hidden aria-label="Payment notes">
<div class="workspace"><aside class="queue" aria-label="Note queue">
<div class="queue-tabs" role="group" aria-label="Queue"><button data-queue="open" aria-pressed="true">Inbox <span></span></button><button data-queue="waiting" aria-pressed="false">Waiting <span></span></button><button data-queue="resolved" aria-pressed="false">Done <span></span></button></div>
<label class="sr-only" for="search">Search notes</label><input id="search" type="search" placeholder="Search notes…"><div id="tickets"></div><button id="refresh" class="quiet">Refresh</button>
</aside><section id="detail" class="detail" aria-label="Note editor">
<div id="placeholder"><span>↗</span><h2>Just leave a note.</h2><p>Paste a screenshot, jot down what’s going on,<br>and move it along when you’re ready.</p><button id="empty-new" class="quiet">+ New note</button></div>
<div id="note" hidden><button id="back" class="quiet mobile-back">← Back to queue</button>
<div class="note-top"><span id="note-stage" class="badge">Inbox</span><span id="save-state" role="status" aria-live="polite"></span></div>
<label class="sr-only" for="note-title">Note title (optional)</label><input id="note-title" placeholder="Untitled note" maxlength="160" autocomplete="off">
<p id="upload-state" class="muted small" role="status"></p><div id="screenshots" class="screenshots"></div>
<div id="editor-mount"><textarea id="note-body" placeholder="What’s going on? Write freely. Paste a screenshot whenever you need one."></textarea></div>
<div class="note-bottom"><button id="attach" class="quiet">+ Screenshot</button><button id="save" class="quiet">Save note</button></div>
<div class="move-actions" role="group" aria-label="Move note"><span>Move to</span><button data-move="open">Inbox</button><button data-move="waiting">Waiting</button><button data-move="resolved" class="primary">Done ✓</button></div>
<details id="earlier" hidden><summary>Earlier details</summary><div id="legacy-details"></div></details>
<details id="history"><summary>History</summary><div id="events"></div></details>
</div></section></div></section><noscript>Enable JavaScript to use Payment questions.</noscript></main>
<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
<dialog id="image-dialog" aria-label="Screenshot"><button id="close-image" class="quiet">Close</button><img id="full-image" alt="Attached screenshot"></dialog>
</body></html>
