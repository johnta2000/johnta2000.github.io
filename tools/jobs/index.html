<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Recurring jobs · John Ta</title>
  <link rel="icon" href="../../assets/img/jt-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=sheet-2">
  <link rel="stylesheet" href="../access/auth.css">
  <script async data-clerk-script crossorigin="anonymous" src="https://clerk.john-ta.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script async data-clerk-script crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuam9obi10YS5jb20k" src="https://clerk.john-ta.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
  <script defer src="app.js?v=sheet-2"></script>
</head>
<body>
<main>
  <nav><a href="../../login/">← Your apps</a><button id="signout" hidden>Sign out</button></nav>
  <h1>Recurring jobs</h1>
  <section id="gate" data-auth-panel>
    <h2>Owner sign-in</h2><p id="message" role="status">Checking access…</p>
    <div id="signin" data-clerk-mount></div><button id="retry" hidden>Try again</button>
  </section>
  <section id="inventory" hidden aria-label="Job inventory">
    <div class="toolbar">
      <input id="search" type="search" aria-label="Search jobs" placeholder="Search jobs" autocomplete="off">
      <a id="show-all" href="./" hidden>Show all jobs</a>
      <span id="count" role="status"></span>
    </div>
    <div class="sheet" role="region" aria-label="Recurring jobs spreadsheet" tabindex="0">
      <table aria-label="Recurring jobs">
        <thead><tr>
          <th scope="col" class="name-heading"><a data-sort="name" href="?sort=name-asc">Job name <span aria-hidden="true"></span></a></th>
          <th scope="col" class="status-heading"><a data-sort="status" href="?sort=status-desc">Status <span aria-hidden="true"></span></a></th>
          <th scope="col" class="frequency-heading"><a data-sort="frequency" href="?sort=frequency-asc">Frequency <span aria-hidden="true"></span></a></th>
          <th scope="col" class="time-heading"><a data-sort="time" href="?sort=time-asc">Pacific time <span aria-hidden="true"></span></a></th>
          <th scope="col" class="actions-heading">Codex</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" role="status" hidden></p>
    <footer class="meta"><p id="updated"></p><button id="refresh">Refresh</button></footer>
  </section>
  <noscript>Enable JavaScript to sign in and view your jobs.</noscript>
</main>
</body>
</html>
