<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Recurring jobs · John Ta</title>
  <link rel="icon" href="../../assets/img/jt-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../access/auth.css">
  <script async data-clerk-script crossorigin="anonymous" src="https://clerk.john-ta.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script async data-clerk-script crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuam9obi10YS5jb20k" src="https://clerk.john-ta.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main>
  <nav><a href="../../login/">← Your apps</a><button id="signout" hidden>Sign out</button></nav>
  <h1>Recurring jobs</h1>
  <section id="gate" data-auth-panel>
    <h2>Owner sign-in</h2><p id="message" role="status">Checking access…</p>
    <div id="signin" data-clerk-mount></div><button id="retry" hidden>Try again</button>
  </section>
  <section id="inventory" hidden aria-label="Job inventory">
    <div class="toolbar"><div class="tabs" aria-label="Job status"><a id="active" href="./">Active</a><a id="paused" href="?status=paused">Paused</a></div>
      <input id="search" type="search" aria-label="Search jobs" placeholder="Search jobs" autocomplete="off"></div>
    <div class="meta"><p id="updated"></p><button id="refresh">Refresh</button></div>
    <ul id="rows"></ul><p id="empty" role="status" hidden></p>
  </section>
  <noscript>Enable JavaScript to sign in and view your jobs.</noscript>
</main>
</body>
</html>
