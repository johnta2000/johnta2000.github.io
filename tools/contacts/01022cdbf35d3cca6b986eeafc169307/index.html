<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f6f1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://rapid-shark-565.convex.site; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Decadence contacts</title><link rel="icon" href="/assets/img/jt-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="../styles.css?v=20261102-compact"><script defer src="../app.js"></script></head>
<body><main><h1>Decadence contacts</h1>
<p id="expiry" class="expiry"></p><p id="status" role="status" aria-live="polite">Loading contacts…</p>
<section id="notice" class="notice" hidden><h2 id="notice-title">Contacts unavailable</h2><p id="notice-body"></p><button id="retry" type="button" class="button">Try again</button></section>
<section id="content" hidden aria-label="Group contacts"><div class="actions"><button id="everyone" class="button primary" type="button">Download everyone</button><button id="selected" class="button secondary" type="button" disabled>Download selected (0)</button></div>
<div class="list-top"><h2 id="count">People</h2><div class="selection-tools"><button id="select-all" class="text-button" type="button">Select all</button><button id="clear" class="text-button" type="button">Clear</button></div></div>
<ul id="list" class="contact-list"></ul><p class="footnote">Downloads are contact cards (.vcf). Open the file on your phone or computer to add them to your address book. This page closes automatically after a week; contacts you have saved stay yours.</p></section>
<noscript><p>Enable JavaScript to choose and download contacts.</p></noscript></main></body></html>
