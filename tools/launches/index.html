<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f7f3">
  <title>NextCard Launches</title>
  <link rel="icon" href="../../assets/img/jt-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/searchable-select.css?v=20261016">
  <link rel="stylesheet" href="styles.css?v=20261019-4">
  <link rel="stylesheet" href="../../assets/css/clerk-auth.css?v=20261011-otp1">
  <script async data-clerk-script crossorigin="anonymous" src="https://clerk.john-ta.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script async data-clerk-script crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsuam9obi10YS5jb20k" src="https://clerk.john-ta.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
  <script defer src="../../assets/js/searchable-select.js?v=20261016"></script>
  <script defer src="model.js?v=20261019-1"></script>
  <script defer src="routes.js?v=20261019-2"></script>
  <script defer src="app.js?v=20261019-4"></script>
  <script defer src="auth.js?v=20261016-3"></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to workspace</a>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">n<span>↗</span></span><span>NextCard <span class="brand-divider">/</span> <strong>Launches</strong></span></div>
    <div class="account"><a href="../../login/">Your apps</a><button id="sign-out" class="quiet" type="button" hidden>Sign out</button></div>
  </header>
  <main>
    <section id="gate" class="auth-gate" data-auth-panel aria-labelledby="gate-title">
      <p class="eyebrow">NextCard workspace</p><h1 id="gate-title">A clear path to launch.</h1>
      <p id="gate-message" role="status">Loading sign-in…</p>
      <div id="sign-in" data-clerk-mount></div><button id="retry-auth" type="button" hidden>Try again</button>
    </section>
    <div id="app" hidden>
      <div class="workspace-bar"><nav class="main-nav" aria-label="Workspace"><button data-view="channels" type="button" aria-current="page">Channels</button><button data-view="launches" type="button">Launches</button></nav><div class="sync"><span id="save-status" role="status"></span><button id="copy-view-link" class="quiet copy-page-link" type="button" aria-label="Copy link to this view">Copy link</button><button id="refresh" class="quiet" type="button">Refresh</button></div></div>
      <div id="storage-error" class="error" role="alert" hidden></div>
      <div id="save-actions" class="save-actions" hidden><button id="retry-save" type="button">Retry save</button><button id="download-draft" type="button">Download unsaved work</button><button id="load-latest" type="button">Load latest</button></div>
      <section id="content" tabindex="-1" aria-label="Launch workspace"></section>
      <footer class="workspace-footer"><span id="team-label"></span><span>Plan here. Publish in each channel.</span></footer>
    </div>
    <noscript>Enable JavaScript to sign in and use NextCard Launches.</noscript>
  </main>
  <dialog id="editor" aria-labelledby="editor-title"><div id="editor-content"></div></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
